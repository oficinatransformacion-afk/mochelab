services:
  - type: web
    name: mochelab-api-dev
    runtime: node
    plan: free
    region: oregon
    branch: develop
    buildCommand: pnpm install --frozen-lockfile && pnpm --filter @mochelab/shared build && pnpm --filter @mochelab/api db:generate && pnpm --filter @mochelab/api build
    startCommand: pnpm --filter @mochelab/api db:deploy && pnpm --filter @mochelab/api start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: CORS_ORIGIN
        value: https://mochelab-web-dev.onrender.com
      - key: AUTH_SESSION_SECRET
        generateValue: true
      - key: GOOGLE_FORMS_INTEGRATION_KEY
        generateValue: true
      - key: GOOGLE_GMAIL_ENABLED
        value: "false"
      - key: COURSE_REMINDER_ENABLED
        value: "false"
      - key: GOOGLE_GMAIL_SENDER_NAME
        value: Oficina de Transformación
      - key: GOOGLE_GMAIL_SENDER_EMAIL
        value: oficinatransformacion@danper.com

  - type: web
    name: mochelab-web-dev
    runtime: static
    branch: develop
    buildCommand: pnpm install --frozen-lockfile && pnpm --filter @mochelab/shared build && pnpm --filter @mochelab/web build
    staticPublishPath: ./apps/web/dist
    envVars:
      - key: VITE_API_URL
        value: https://mochelab-api-dev.onrender.com
      - key: VITE_APP_ENV
        value: development
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

  - type: web
    name: mochelab-api
    runtime: node
    plan: free
    region: oregon
    buildCommand: pnpm install --frozen-lockfile && pnpm --filter @mochelab/shared build && pnpm --filter @mochelab/api db:generate && pnpm --filter @mochelab/api build
    startCommand: pnpm --filter @mochelab/api db:deploy && pnpm --filter @mochelab/api start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: CORS_ORIGIN
        value: https://mochelab-web.onrender.com
      - key: AUTH_SESSION_SECRET
        generateValue: true
      - key: GOOGLE_FORMS_INTEGRATION_KEY
        generateValue: true
      - key: GOOGLE_GMAIL_ENABLED
        value: "false"
      - key: GOOGLE_GMAIL_SENDER_NAME
        value: Oficina de Transformación
      - key: GOOGLE_GMAIL_SENDER_EMAIL
        value: oficinatransformacion@danper.com
      - key: APPS_SCRIPT_EMAIL_ENABLED
        value: "true"
      - key: APPS_SCRIPT_EMAIL_WEB_APP_URL
        sync: false
      - key: APPS_SCRIPT_EMAIL_SECRET
        sync: false
      - key: APPS_SCRIPT_EMAIL_SENDER_NAME
        value: Oficina de Transformación
      - key: COMMUNICATION_AUTO_SEND_ENABLED
        value: "true"
      - key: COMMUNICATION_AUTO_SEND_HOUR
        value: "8"
      - key: COMMUNICATION_AUTO_SEND_MINUTE
        value: "0"
      - key: COMMUNICATION_AUTO_SEND_TIME_ZONE
        value: America/Lima
      - key: COMMUNICATION_AUTO_SEND_BATCH_SIZE
        value: "25"
      - key: COMMUNICATION_AUTO_SEND_DAILY_MAX
        value: "500"
      - key: COMMUNICATION_MAX_ATTEMPTS
        value: "3"
      - key: COURSE_REMINDER_ENABLED
        value: "true"
      - key: COURSE_REMINDER_DAYS
        value: MONDAY,WEDNESDAY,FRIDAY
      - key: COURSE_REMINDER_RETENTION_DAYS
        value: "30"

  - type: web
    name: mochelab-web
    runtime: static
    buildCommand: pnpm install --frozen-lockfile && pnpm --filter @mochelab/shared build && pnpm --filter @mochelab/web build
    staticPublishPath: ./apps/web/dist
    envVars:
      - key: VITE_API_URL
        value: https://mochelab-api.onrender.com
      - key: VITE_APP_ENV
        value: production
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
